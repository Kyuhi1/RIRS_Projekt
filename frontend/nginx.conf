server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Dockerjev DNS: naslov backenda se znova razreši, ko se backend ponovno ustvari (nov IP).
    resolver 127.0.0.11 valid=5s;
    set $backend http://backend:3000;
    proxy_pass $backend;
  }

  location / {
    try_files $uri /index.html;
  }
}
